# Helm values overlay for running this bundle on a LOCAL kind cluster.
#
#   helm upgrade --install larkspur /path/to/fleet/deploy/helm/fleet \
#     --namespace larkspur \
#     -f deploy/kubernetes/values-kind.yaml \
#     --set image.repository=localhost/larkspur-fleet --set image.tag=dev \
#     --set sandbox.image=localhost/larkspur-sandbox:dev
#
# This is an EVALUATION overlay. It is not values-example.yaml with the
# registry swapped out — it deliberately trades away four production
# properties, and each one is called out below so you never promote this file.
# Full walkthrough: docs/LOCAL-CLUSTER-KIND.md.

# ── images: side-loaded, never pulled ───────────────────────────────────────
image:
  # `kind load image-archive` puts the image in each node's containerd store.
  # Never = the kubelet must not try a registry, since localhost/ is not one.
  pullPolicy: Never

# No registry, so no pull secret. (Overrides nothing — the chart default is
# already empty — but stating it keeps a copy-paste from values-example.yaml
# from carrying a `regcred` that does not exist here.)
imagePullSecrets: []

# ── sandbox ─────────────────────────────────────────────────────────────────
sandbox:
  backend: kubernetes
  kubernetes:
    namespace: ""
    podServiceAccount:
      create: true
      name: larkspur-sandbox
    # Empty: the sandbox image is side-loaded, not pulled.
    #
    # HONEST NOTE: fleet hard-codes imagePullPolicy: IfNotPresent on every
    # sandbox pod it creates (internal/sandbox/k8s_backend.go), precisely so a
    # side-loaded image works. There is no chart value for it, and you do not
    # need one.
    imagePullSecret: ""
    runtimeClass: ""
    seccompProfile: ""
    # Same requirement as production: the sandbox image bakes the bundle's doc
    # dirs, so keep this true and build the sandbox image with
    # deploy/kubernetes/Containerfile.sandbox, not the bare base.
    bundleDocsInImage: true
    nodeSelector: {}
    tolerations: []
  # Smaller than production so a laptop can actually schedule a sandbox pod
  # alongside the control plane and Postgres. Requests equal limits, so these
  # numbers are reserved, not just capped.
  memory: "1g"
  cpus: "1.0"
  diskGB: 5
  # DEGRADED #1: no warm pool. Every turn pays a cold pod start (schedule +
  # exec of the bridge upload). Fine for a walkthrough, wrong for production.
  # Needs a fleet that understands warmSize: 0 (ElcanoTek/fleet#1288); older
  # fleet treated 0 as "derive from the concurrency cap" and silently ran a
  # two-pod warm pool despite this comment.
  warmSize: 0

# ── storage ─────────────────────────────────────────────────────────────────
workspace:
  create: true
  claimName: fleet-workspace
  size: 5Gi
  # DEGRADED #2: kind's default `standard` class is ReadWriteOnce. That works
  # here only because a one-node cluster puts the control plane and every
  # sandbox pod on the same node. On any multi-node cluster this silently
  # becomes unschedulable sandbox pods. Production needs a ReadWriteMany class
  # — see values-example.yaml.
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

data:
  create: true
  claimName: fleet-data
  size: 5Gi
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

# ── egress ──────────────────────────────────────────────────────────────────
networkPolicies:
  # DEGRADED #3: this object MUST exist — fleet's boot preflight refuses to
  # start without it — but whether it is ENFORCED is the CNI's business, and
  # fleet cannot tell the difference: the object is there, the preflight
  # passes, and on a non-enforcing CNI a "sealed" sandbox still reaches the
  # internet. kind's bundled kindnetd does NOT enforce NetworkPolicy (verified
  # on kindnetd v20260528 / kind v0.32.0: a sealed-label pod fetched an
  # external page with this object in place); Calico and Cilium do. Run the
  # seal test in docs/LOCAL-CLUSTER-KIND.md ("Verifying the seal on kind") —
  # sealed run AND unlabeled control, http not https — and install a
  # policy-enforcing CNI (same doc) before trusting lockdown.
  denyAll:
    create: true
    name: fleet-sandbox-deny-all
  openEgress:
    create: false
    blockedCIDRs: []

# ── config ──────────────────────────────────────────────────────────────────
config:
  # Create it first:
  #   kubectl -n larkspur create secret generic larkspur-secrets \
  #     --from-literal=OPENROUTER_API_KEY=sk-or-...
  # The DB URLs come from the chart's in-cluster Postgres below, so they do
  # not belong in this Secret on the kind path.
  existingSecret: larkspur-secrets
  env:
    # `open` rather than `lockdown` on purpose: kind's bundled kindnetd does
    # not enforce the deny-all policy (see DEGRADED #3), and `open` never
    # claims a seal the cluster is not delivering. Once the seal test proves
    # enforcement on YOUR cluster (e.g. after installing Calico), flip this
    # to `lockdown`. `allowlisted` is refused at boot under this backend.
    FLEET_DEFAULT_NETWORK_MODE: open
    FLEET_MAX_CONCURRENT_AGENTS: "2"
    FLEET_TIMEZONE: "UTC"
    PERSONA_DEFAULT: assistant

# ── database ────────────────────────────────────────────────────────────────
postgres:
  # DEGRADED #4: the chart's evaluation Postgres — one replica, one PVC, no
  # backups, a password Helm generates into the <release>-postgres Secret.
  # Enabled here so the walkthrough needs no external database; never in
  # production.
  enabled: true
  size: 5Gi

# ── exposure ────────────────────────────────────────────────────────────────
web:
  enabled: false
service:
  type: ClusterIP
ingress:
  enabled: false

# ── control plane ───────────────────────────────────────────────────────────
# Sized to fit beside a sandbox pod and Postgres on one Docker VM. Raise the
# requests and you will get an unschedulable control plane on a 4-CPU laptop
# instead of a clear error.
resources:
  requests:
    cpu: "500m"
    memory: 1Gi
  limits:
    memory: 2Gi
