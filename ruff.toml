# Ruff configuration for Python linting. Lives at the repo ROOT so both
# `ruff check mcp/` and `ruff format --check mcp/` find it from anywhere.

target-version = "py311"
line-length = 120

# The MCP servers, their tests, and the skills' bundled scripts. skills/ is
# included on purpose: those scripts run inside the sandbox, and a template
# that ships an unlinted script is a template that ships a broken one.
include = ["mcp/**/*.py", "skills/**/*.py"]

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]

ignore = [
    "E501",   # Line too long (handled by the formatter)
    "B008",   # Do not perform function calls in argument defaults
    "C901",   # Too complex
    "ARG001", # Unused function argument (common in MCP handlers)
]

fixable = ["ALL"]
unfixable = []

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
